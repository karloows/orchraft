name: Validate Plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.270
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate skills
        run: claude plugin validate skills --strict
      # Not --strict: the root CLAUDE.md warning is expected, since that file
      # is a pointer for contributors, not plugin context.
      - name: Validate plugin manifest
        run: claude plugin validate .claude-plugin/plugin.json
